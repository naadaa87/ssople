<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모임 안내 — 쏘플파티룸</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="파티 참석자를 위한 안내 페이지입니다. 주소, 시간, 주차, 이용 수칙을 확인하세요." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23E83217'/%3E%3Cstop offset='1' stop-color='%23ff6a4e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpolygon points='16,5 18.7,12.8 27,12.8 20.3,17.8 22.9,26 16,20.9 9.1,26 11.7,17.8 5,12.8 13.3,12.8' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --ink:#17181c; --paper:#ffffff; --paper-2:#f7f8fa;
  --text:#4a4c54; --muted:#84868f; --line:#eceef2; --line-2:#dfe1e8;
  --clay:#E83217; --clay-deep:#c62912; --clay-50:#fdefee;
  --sans:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo',sans-serif;
  --sh:0 1px 2px rgba(23,24,28,.04),0 6px 20px rgba(23,24,28,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper-2);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none} button{font-family:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 60px}
.bar{background:#fff;border-bottom:1px solid var(--line)}
.bar .in{max-width:560px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:8px}
.bar .bm{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--clay),#ff6a4e);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.bar .bn{font-weight:800;font-size:14px;letter-spacing:.02em}
.bar small{margin-left:auto;color:var(--muted);font-size:12px}

.hero{background:linear-gradient(180deg,#fff 0%,var(--paper-2) 100%);padding:30px 0 22px;text-align:center}
.hero .badge{display:inline-flex;align-items:center;gap:6px;background:var(--clay-50);color:var(--clay-deep);
  font-size:12.5px;font-weight:800;border-radius:30px;padding:7px 14px;margin-bottom:12px}
.hero h1{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.hero .sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.dday{display:inline-flex;align-items:baseline;gap:4px;margin-top:14px;background:var(--ink);color:#fff;
  border-radius:14px;padding:10px 18px;font-weight:800}
.dday b{font-size:20px;color:#ffb4a6}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-top:14px}
.card h2{font-size:13px;font-weight:800;color:var(--clay);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14.5px;align-items:baseline}
.row .k{color:var(--muted);flex:none}
.row .v{font-weight:700;text-align:right;word-break:keep-all}
.big{font-size:17px;font-weight:800;letter-spacing:-.02em}
.addr{font-size:15px;font-weight:700;line-height:1.6;word-break:keep-all}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:100px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-weight:700;font-size:13.5px;padding:12px 10px;border-radius:11px;transition:.15s;white-space:nowrap}
.btn-clay{background:var(--clay);color:#fff}
.btn-clay:active{background:var(--clay-deep)}
.btn-line{border:1.5px solid var(--line-2);background:#fff}
.btn-line:active{border-color:var(--ink)}
.tip{font-size:13px;color:var(--text);padding:9px 0;border-top:1px dashed var(--line);display:flex;gap:9px}
.tip:first-of-type{border-top:none}
.tip .ic{flex:none}
.note{background:var(--clay-50);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--clay-deep);margin-top:12px}
.foot{margin-top:26px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.9}
.foot a{color:var(--clay);font-weight:700}
.state{padding:70px 18px;text-align:center}
.state .em{font-size:44px;margin-bottom:12px}
.state h1{font-size:19px;font-weight:800;margin-bottom:8px}
.state p{color:var(--muted);font-size:14px}
.skel{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--line) 25%,#f3f4f7 50%,var(--line) 75%);
  background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>

<div class="bar"><div class="in">
  <span class="bm">✦</span><span class="bn">SSOPLE 쏘플파티룸</span>
  <small>참석자 안내</small>
</div></div>

<main id="main">
  <div class="wrap">
    <div class="card" style="margin-top:20px"><div class="skel" style="width:60%"></div>
      <div class="skel" style="width:85%;margin-top:10px"></div>
      <div class="skel" style="width:40%;margin-top:10px"></div></div>
  </div>
</main>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const P = new URLSearchParams(location.search);
const token = (P.get('t') || '').trim();
const DOW = ['일','월','화','수','목','금','토'];

init();
async function init() {
  const main = document.getElementById('main');
  if (!token) return fail('링크가 올바르지 않습니다', '초대해 주신 분께 링크를 다시 받아주세요.');

  let g;
  try {
    const res = await fetch('/api/guest/' + encodeURIComponent(token));
    const d = await res.json();
    if (!d.ok) return fail('안내를 찾을 수 없습니다', d.message || '링크를 다시 확인해 주세요.');
    g = d.guest;
  } catch {
    return fail('안내를 불러오지 못했습니다', '네트워크 상태를 확인하고 다시 열어주세요.');
  }

  if (g.status === 'canceled')
    return fail('이 모임은 취소되었습니다', '자세한 내용은 초대해 주신 분께 확인해 주세요.', '📭');

  const d0 = new Date(g.useDate + 'T00:00:00+09:00');
  const dateStr = `${d0.getMonth() + 1}월 ${d0.getDate()}일 (${DOW[d0.getDay()]})`;
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const dday = Math.round((new Date(g.useDate) - new Date(today)) / 86400000);
  const ddayHtml = g.past || g.status === 'completed'
    ? `<div class="dday">즐거운 시간이었기를! 🎉</div>`
    : dday === 0 ? `<div class="dday"><b>오늘</b>이에요! 🎉</div>`
    : `<div class="dday">D−<b>${dday}</b></div>`;

  main.innerHTML = `
  <section class="hero">
    <span class="badge">🎈 ${esc(g.hostName)}님의 초대</span>
    <h1>${esc(g.branchName)}에서 만나요</h1>
    <div class="sub">${esc([g.region, g.area].filter(Boolean).join(' · '))} · 프라이빗 파티룸</div>
    ${ddayHtml}
  </section>

  <div class="wrap">
    <div class="card">
      <h2>When · 언제</h2>
      <div class="big">${dateStr}</div>
      <div class="row"><span class="k">타임</span><span class="v">${esc(g.slotLabel)} ${esc(g.slotTime)}</span></div>
      <div class="row"><span class="k">인원</span><span class="v">${g.people}명 예약 (공간 최대 ${g.maxPeople}명)</span></div>
      <div class="btns">
        <button class="btn btn-line" id="icsBtn">📅 내 캘린더에 추가</button>
      </div>
    </div>

    <div class="card">
      <h2>Where · 어디로</h2>
      <div class="addr">${esc(g.address || '')}</div>
      <div class="btns">
        <button class="btn btn-line" id="cpAddr">주소 복사</button>
        <a class="btn btn-line" target="_blank" rel="noopener"
           href="https://map.kakao.com/link/search/${encodeURIComponent(g.address || g.branchName)}">카카오맵</a>
        <a class="btn btn-line" target="_blank" rel="noopener"
           href="https://map.naver.com/v5/search/${encodeURIComponent(g.address || g.branchName)}">네이버지도</a>
      </div>
      ${g.parking ? `<div class="note">🚗 <b>주차</b> — ${esc(g.parking)}</div>`
                  : `<div class="note">🚗 주차 공간이 따로 없을 수 있어요. 대중교통을 추천합니다.</div>`}
    </div>

    <div class="card">
      <h2>Tips · 알아두면 좋아요</h2>
      <div class="tip"><span class="ic">🍰</span><span>음식·음료·케이크 반입 자유! 배달 주소는 위 주소를 그대로 쓰면 됩니다.</span></div>
      <div class="tip"><span class="ic">🚪</span><span>입장은 타임 시작 시각부터예요. 출입 방법은 예약하신 ${esc(g.hostName)}님이 알고 계십니다.</span></div>
      <div class="tip"><span class="ic">⏰</span><span>종료 시각은 꼭 지켜주세요. 다음 팀을 위한 정비 시간이 이어집니다.</span></div>
      <div class="tip"><span class="ic">🧹</span><span>쓰레기 분리배출과 뒷정리를 함께 해주시면 보증금이 온전히 돌아갑니다.</span></div>
      ${g.guide ? `<div class="tip"><span class="ic">📌</span><span><b>이 지점 안내</b> — ${esc(g.guide)}</span></div>` : ''}
    </div>

    <div class="btns" style="margin-top:16px">
      <button class="btn btn-clay" id="shareBtn" style="flex:2">이 안내 다시 공유하기</button>
    </div>

    <div class="foot">
      쏘플파티룸 고객센터 ${esc(g.csPhone)}<br>
      월–목 10:00–19:00 · 금–일 10:00–22:00<br>
      <a href="/">나도 파티룸 예약해 보기 →</a>
    </div>
  </div>`;

  /* 주소 복사 */
  document.getElementById('cpAddr').onclick = async () => {
    try { await navigator.clipboard.writeText(g.address || ''); flash('주소를 복사했어요'); }
    catch { flash('길게 눌러 복사해 주세요'); }
  };

  /* 다시 공유 */
  document.getElementById('shareBtn').onclick = async () => {
    const data = { title: '모임 안내 — 쏘플파티룸',
      text: `${g.hostName}님의 파티 · ${dateStr} ${g.slotLabel}`, url: location.href };
    if (navigator.share) { try { await navigator.share(data); } catch {} }
    else { try { await navigator.clipboard.writeText(location.href); flash('링크를 복사했어요'); } catch {} }
  };

  /* .ics 캘린더 파일 — 밤타임이 자정을 넘으면 종료일을 다음 날로 */
  document.getElementById('icsBtn').onclick = () => {
    const pad = (n) => String(n).padStart(2, '0');
    const mk = (dateStr, hour) => {
      const d = new Date(dateStr + 'T00:00:00+09:00');
      d.setHours(d.getHours() + hour);
      return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}0000`;
    };
    const ics = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//SSOPLE//guest//KO',
      'BEGIN:VEVENT',
      `UID:${token}@ssople`,
      `DTSTART;TZID=Asia/Seoul:${mk(g.useDate, g.startHour)}`,
      `DTEND;TZID=Asia/Seoul:${mk(g.useDate, g.endHour)}`,
      `SUMMARY:🎉 ${g.branchName} 파티 (${g.slotLabel})`,
      `LOCATION:${(g.address || '').replace(/,/g, '\\,')}`,
      `DESCRIPTION:${g.hostName}님의 초대 · 쏘플파티룸\\n안내: ${location.href}`,
      'END:VEVENT', 'END:VCALENDAR',
    ].join('\r\n');
    const a = document.createElement('a');
    a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
    a.download = 'ssople-party.ics';
    a.click();
  };
}

function fail(title, desc, em = '🔍') {
  document.getElementById('main').innerHTML = `
    <div class="state"><div class="em">${em}</div>
      <h1>${esc(title)}</h1><p>${esc(desc)}</p>
      <p style="margin-top:22px"><a href="/" style="color:var(--clay);font-weight:700">쏘플파티룸 홈으로 →</a></p>
    </div>`;
}

let flashT;
function flash(msg) {
  clearTimeout(flashT);
  let el = document.getElementById('flash');
  if (!el) {
    el = document.createElement('div');
    el.id = 'flash';
    el.style.cssText = `position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
      background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;
      padding:11px 18px;border-radius:30px;z-index:99;box-shadow:var(--sh)`;
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = '';
  flashT = setTimeout(() => (el.style.display = 'none'), 1800);
}
</script>
<script src="/assets/chat.js" defer></script>
</body>
</html>
