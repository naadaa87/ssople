# ============================================================
# 쏘플파티룸 고객 홈페이지 — Cloudflare Pages 설정
#
# 바꿀 곳은 한 군데: 아래 ① 의 database_id
#   Cloudflare → Storage & Databases → D1 에서 ssople-web 을 만들고
#   화면에 나오는 Database ID 를 "여기에-..." 자리에 붙여넣으세요.
# name 은 Cloudflare Pages 프로젝트 이름이에요 (ssople.pages.dev → ssople). 그대로 두세요.
# ============================================================
name = "ssople"
compatibility_date = "2026-07-01"
pages_build_output_dir = "."

# ① 고객 홈페이지 전용 DB (회원·커뮤니티·모임·행사·방막기)
#    처음 접속할 때 표가 자동으로 만들어지고 지점 데이터(운영 36곳 공개)가 들어갑니다. SQL을 실행할 필요가 없어요.
#    ssople-web Database ID 입력 완료 (2026.10.12)
[[d1_databases]]
binding = "DB"
database_name = "ssople-web"
database_id = "da797810-a703-49b5-ac96-231d7b7c7b26"

# ② 호스트 예약 DB — 지금은 쓰지 않아요 (호스트·대시보드·챗봇 보류).
#    나중에 호스트 센터를 다시 쓰고, 그 DB가 이 Cloudflare 계정의 D1이라면
#    아래 4줄 앞의 # 을 지우고 database_name / database_id 를 그 DB 값으로 바꾸세요.
#    그러면 호스트 예약이 빈 방 표시에 자동으로 들어와요. (읽기만 해요)
# [[d1_databases]]
# binding = "HOSTDB"
# database_name = "ssople-host"
# database_id = "1c81ebe1-77db-4518-900a-0ffd11a3b646"

# ③ 사진 저장소 (후기·모임·지점 사진)
#    R2 버킷이 없어서 배포가 실패하면 아래 3줄 앞에 # 을 붙이세요. 사진 올리기만 꺼져요.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "ssople-photos"

# 비밀값은 여기에 적지 않습니다. (Settings → Variables and Secrets 에서 'Secret' 으로 추가)
#   ADMIN_PASSWORD : 관리자 화면(/admin) 비밀번호 — 꼭 필요
#   SYNC_TOKEN     : (나중에) 호스트 예약 10분마다 자동 업데이트·외부 예약 수신을 쓸 때만
# 호스트 센터 아이디·비밀번호는 어디에도 넣지 않습니다.
