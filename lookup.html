<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>예약 조회 — 쏘플파티룸</title><meta name="robots" content="index,follow" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e8352e'/%3E%3Cpolygon points='16,5 18.7,12.8 27,12.8 20.3,17.8 22.9,26 16,20.9 9.1,26 11.7,17.8 5,12.8 13.3,12.8' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="/assets/app.css" />
<link rel="stylesheet" href="/assets/wire.css" />
<style>
  .bar{background:#fff;border-bottom:1px solid var(--line);padding:16px 0}
  .bar .in{max-width:640px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:9px}
  .bar .bm{color:var(--clay)} .bar .bn{font-weight:900;letter-spacing:.06em;font-size:15px}
  .page{max-width:560px;margin:0 auto;padding:44px 20px 80px}
  h1{font-size:25px;font-weight:900;letter-spacing:-.03em;margin-bottom:8px}
  .lead{color:var(--muted);font-size:14.5px;margin-bottom:30px;line-height:1.7}
  .info .r{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:14.5px}
  .info .k{color:var(--muted);font-weight:600;flex:none}
  .info .v{font-weight:700;text-align:right}
  .code{background:var(--ink);color:#fff;border-radius:12px;padding:15px 18px;margin-bottom:18px;
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  .code .n{font-size:19px;font-weight:900;letter-spacing:.05em}
</style>
</head>
<body>
<div class="bar"><div class="in"><a href="/" style="display:flex;gap:8px;align-items:center">
  <span class="bm">✦</span><span class="bn">SSOPLE</span></a></div></div>
<div class="page">
  <h1>예약 조회</h1>
  <p class="lead">예약번호와 예약하실 때 쓰신 연락처를 넣어주세요.<br>회원이시라면 <a href="/mypage.html" style="color:var(--clay);font-weight:700">마이페이지</a>에서 바로 보실 수 있습니다.</p>
  <div id="form">
    <div class="field"><label for="code">예약번호</label>
      <input class="input" id="code" placeholder="SP26080112" autocomplete="off"></div>
    <div class="field"><label for="phone">연락처</label>
      <input class="input" id="phone" type="tel" inputmode="numeric" placeholder="01012345678"></div>
    <div class="err-msg" id="err" hidden></div>
    <button class="btn btn-clay btn-block" id="go" style="margin-top:8px">조회하기</button>
  </div>
  <div id="result"></div>
</div>
<script src="/assets/app.js"></script>
<script>
const q = new URLSearchParams(location.search);
if (q.get('code')) document.getElementById('code').value = q.get('code');

document.getElementById('go').onclick = lookup;
['code','phone'].forEach(id => document.getElementById(id)
  .addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); }));

async function lookup() {
  const err = document.getElementById('err');
  const btn = document.getElementById('go');
  err.hidden = true;
  const code = document.getElementById('code').value.trim();
  const phone = document.getElementById('phone').value.replace(/[^0-9]/g, '');
  if (!code || phone.length < 10) { err.textContent = '예약번호와 연락처를 확인해 주세요.'; err.hidden = false; return; }

  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try {
    const d = await API.post('/api/reservations/lookup', { code, phone }, { silent: true });
    show(d.reservation);
  } catch (e) {
    err.textContent = e.message; err.hidden = false;
  }
  btn.disabled = false; btn.textContent = '조회하기';
}

function show(r) {
  document.getElementById('form').style.display = 'none';
  document.getElementById('result').innerHTML = `
    <div class="code"><span style="font-size:12px;opacity:.7">예약번호</span><span class="n">${esc(r.code)}</span></div>
    <div style="margin-bottom:14px">${statusBadge(r.status)}</div>
    <div class="card info">
      <div class="r"><span class="k">지점</span><span class="v">${esc(r.branchName)}</span></div>
      <div class="r"><span class="k">이용일</span><span class="v">${dateLabel(r.useDate)}</span></div>
      <div class="r"><span class="k">타임</span><span class="v">${esc(r.slotLabel)} ${esc(r.slotTime||'')}</span></div>
      <div class="r"><span class="k">인원</span><span class="v">${r.people}명</span></div>
      <div class="r"><span class="k">주소</span><span class="v">${esc(r.address||'')}</span></div>
      ${r.parking ? `<div class="r"><span class="k">주차</span><span class="v">${esc(r.parking)}</span></div>` : ''}
      <div class="r"><span class="k">총 이용 금액</span><span class="v">${won(r.totalAmount)}</span></div>
      <div class="r"><span class="k">결제하신 예약금</span><span class="v">${won(r.deposit)}</span></div>
      <div class="r"><span class="k">현장 잔금</span><span class="v" style="color:var(--clay-deep)">${won(r.balance)}</span></div>
    </div>
    ${r.accessInfo ? `<div class="note note-ok" style="margin-top:16px">
      <b>오늘 이용하시는 예약입니다.</b><br>${esc(r.accessInfo)}</div>` : ''}
    ${r.refund ? `<div class="note" style="margin-top:16px">${esc(r.refund.label)}<br>
      지금 취소하시면 ${won(r.refund.refundAmount)}을 돌려받습니다.
      취소는 고객센터 또는 지점(${esc(r.branchPhone||'')})으로 연락해 주세요.</div>` : ''}
    <div style="display:flex;gap:10px;margin-top:22px">
      <button class="btn btn-line" style="flex:1" onclick="location.reload()">다시 조회</button>
      <a class="btn btn-clay" style="flex:1" href="/rooms.html">다른 공간 보기</a>
    </div>`;
}
</script>
<script src="/assets/chat.js"></script>
</body>
</html>
