<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>예약하기 — 쏘플파티룸</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e8352e'/%3E%3Cpolygon points='16,5 18.7,12.8 27,12.8 20.3,17.8 22.9,26 16,20.9 9.1,26 11.7,17.8 5,12.8 13.3,12.8' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="/assets/app.css" />
<link rel="stylesheet" href="/assets/wire.css" />
<style>
  .bar{background:#fff;border-bottom:1px solid var(--line);padding:16px 0;position:sticky;top:0;z-index:30}
  .bar .in{max-width:760px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
  .bar .bn{font-weight:900;letter-spacing:.06em;font-size:15px}
  .bar .bm{color:var(--clay)}
  .page{max-width:760px;margin:0 auto;padding:30px 20px 80px}
  .sum{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:22px}
  .sum-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;font-size:14.5px}
  .sum-row .k{color:var(--muted);font-weight:600;flex:none}
  .sum-row .v{font-weight:700;text-align:right}
  .sum-total{border-top:1.5px solid var(--line-2);margin-top:10px;padding-top:14px}
  .sum-total .v{font-size:21px;font-weight:900;color:var(--clay-deep)}
  h2.sec{font-size:17px;font-weight:900;margin:26px 0 14px}
  .pay-methods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .pm{border:1.5px solid var(--line-2);border-radius:12px;padding:16px;text-align:center;
      font-weight:700;font-size:14px;background:#fff;transition:.15s;font-family:inherit;color:var(--ink)}
  .pm.sel{border-color:var(--clay);background:var(--clay-50);color:var(--clay-deep)}
  .nav-btns{display:flex;gap:10px;margin-top:28px}
  .nav-btns .btn{flex:1}
</style>
</head>
<body>

<div class="bar">
  <div class="in">
    <a href="/" style="display:flex;align-items:center;gap:8px">
      <span class="bm">✦</span><span class="bn">SSOPLE</span>
    </a>
    <button class="btn btn-ghost btn-sm" id="quitBtn">그만두기</button>
  </div>
</div>

<div class="page">
  <div id="timerSlot"></div>
  <div class="steps">
    <div class="step on" data-s="1">1. 예약 확인</div>
    <div class="step" data-s="2">2. 예약자 정보</div>
    <div class="step" data-s="3">3. 규정 동의</div>
    <div class="step" data-s="4">4. 예약금 결제</div>
  </div>
  <div id="stage"></div>
</div>

<script src="/assets/app.js"></script>
<script>
/* ============================================================
   예약·결제
   - 진입하면 그 타임을 10분 잠급니다
   - 금액은 서버가 계산한 값만 씁니다
   - 환불 규정을 끝까지 확인해야 결제로 넘어갑니다
   - 결제하는 것은 예약금입니다. 잔금은 현장에서 냅니다.
   ============================================================ */
const P = new URLSearchParams(location.search);
const ctx = {
  branchId: Number(P.get('branch')),
  date: P.get('date'),
  slot: P.get('slot'),
  people: Number(P.get('people') || 0),
  hold: null, branch: null, me: null, step: 1,
  guestName: '', guestPhone: '', requestNote: '',
  method: 'CARD', policyRead: false,
};
let timerId = null;

document.getElementById('stage').innerHTML = loading('예약 정보를 확인하고 있습니다');
init();

async function init() {
  if (!ctx.branchId || !ctx.date || !['day', 'night'].includes(ctx.slot)) {
    stageMsg('예약 정보가 없습니다', '공간과 타임을 먼저 골라주세요.', '/rooms.html', '공간 찾기');
    return;
  }

  ctx.me = await whoami();
  if (!ctx.me.authenticated) {
    location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search);
    return;
  }

  try {
    ctx.branch = (await API.get('/api/branches/' + ctx.branchId, { silent: true })).branch;
    if (!ctx.people) ctx.people = ctx.branch.basePeople;
    ctx.hold = await API.post('/api/holds', {
      branchId: ctx.branchId, date: ctx.date, slot: ctx.slot, people: ctx.people,
    }, { silent: true });
  } catch (e) {
    stageMsg('이 타임은 예약할 수 없습니다', e.message,
      '/room-detail.html?id=' + ctx.branchId, '다른 날짜 보기');
    return;
  }

  startTimer();
  render();
}

function stageMsg(title, desc, href, label) {
  document.getElementById('stage').innerHTML =
    emptyState(title, desc) +
    `<div style="text-align:center"><a class="btn btn-clay" href="${href}">${esc(label)}</a></div>`;
}

function startTimer() {
  document.getElementById('timerSlot').innerHTML =
    `<div class="timer" id="timer"><span>결제를 마치면 이 타임이 확정됩니다</span><b id="tv">10:00</b></div>`;
  const tick = () => {
    const left = Math.max(0, Math.floor((ctx.hold.expiresAt - Date.now()) / 1000));
    const el = document.getElementById('tv');
    if (el) el.textContent =
      `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
    if (left <= 60) document.getElementById('timer')?.classList.add('warn');
    if (left <= 0) {
      clearInterval(timerId);
      const m = modal({
        title: '예약 대기 시간이 지났습니다',
        body: '<p style="font-size:14.5px;color:var(--text);line-height:1.7">10분 안에 결제가 끝나지 않아 고르신 타임이 풀렸습니다. 다시 골라주세요.</p>',
        cancelText: '다시 고르기',
      });
      m.el.querySelector('[data-x]').onclick = () => (location.href = `/room-detail.html?id=${ctx.branchId}`);
    }
  };
  tick();
  timerId = setInterval(tick, 1000);
}

function render() {
  document.querySelectorAll('.step').forEach((el) => {
    const s = Number(el.dataset.s);
    el.className = 'step' + (s === ctx.step ? ' on' : s < ctx.step ? ' done' : '');
  });
  document.getElementById('stage').innerHTML = [step1, step2, step3, step4][ctx.step - 1]();
  bind();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function summaryBox() {
  const h = ctx.hold;
  const slotLabel = ctx.slot === 'night' ? '밤타임' : '낮타임';
  const slotTime = (ctx.branch.slots.find((s) => s.slot === ctx.slot) || {}).time || '';
  return `
  <div class="sum">
    <div class="sum-row"><span class="k">지점</span><span class="v">${esc(ctx.branch.name)}</span></div>
    <div class="sum-row"><span class="k">이용일</span><span class="v">${dateLabel(ctx.date)}</span></div>
    <div class="sum-row"><span class="k">타임</span><span class="v">${slotLabel} ${esc(slotTime)}</span></div>
    <div class="sum-row"><span class="k">인원</span><span class="v">${ctx.people}명${
      h.peopleExtra ? ` (기본 ${h.peopleBase} + 추가 ${h.peopleExtra})` : ''}</span></div>
    <div class="sum-row"><span class="k">타임 요금</span><span class="v">${won(h.baseAmount)}</span></div>
    ${h.extraAmount ? `<div class="sum-row"><span class="k">추가 인원 요금</span><span class="v">${won(h.extraAmount)}</span></div>` : ''}
    <div class="sum-row"><span class="k">총 이용 금액</span><span class="v">${won(h.totalAmount)}</span></div>
    <div class="sum-row sum-total"><span class="k">지금 결제할 예약금</span><span class="v">${won(h.deposit)}</span></div>
    <div class="sum-row"><span class="k">현장에서 낼 잔금</span><span class="v">${won(h.balance)}</span></div>
  </div>`;
}

function step1() {
  return `
    <h2 class="sec">예약 내용을 확인해 주세요</h2>
    ${summaryBox()}
    <div class="note">홈페이지에서는 <b>예약금만</b> 결제합니다. 나머지 잔금은 이용 당일 현장에서 내시면 됩니다.</div>
    <div class="nav-btns">
      <a class="btn btn-line" href="/room-detail.html?id=${ctx.branchId}">타임 바꾸기</a>
      <button class="btn btn-clay" data-next>다음</button>
    </div>`;
}

function step2() {
  return `
    <h2 class="sec">예약자 정보</h2>
    <div class="field">
      <label for="gn">예약자 이름</label>
      <input class="input" id="gn" value="${esc(ctx.guestName || ctx.me.name || '')}" required />
    </div>
    <div class="field">
      <label for="gp">연락처</label>
      <input class="input" id="gp" type="tel" inputmode="numeric" placeholder="01012345678"
             value="${esc(ctx.guestPhone)}" required />
      <div class="hint">예약 확정과 방문 안내를 이 번호로 보내드립니다.</div>
    </div>
    <div class="field">
      <label for="rq">요청 사항 <span style="color:var(--muted);font-weight:600">(선택)</span></label>
      <textarea class="input" id="rq" placeholder="예: 생일파티라 케이크 놓을 자리가 필요해요">${esc(ctx.requestNote)}</textarea>
      <div class="hint">지점 사장님께 그대로 전달됩니다.</div>
    </div>
    <div class="err-msg" id="e2" hidden></div>
    <div class="nav-btns">
      <button class="btn btn-line" data-prev>이전</button>
      <button class="btn btn-clay" data-next>다음</button>
    </div>`;
}

function step3() {
  return `
    <h2 class="sec">약관과 취소·환불 규정</h2>
    <p style="font-size:14px;color:var(--muted);margin-bottom:14px">
      아래 규정을 끝까지 확인하셔야 결제로 넘어갈 수 있습니다.</p>

    <div class="policy-box" id="pbox" tabindex="0">
      <b style="color:var(--ink)">취소 · 환불 규정</b>
      <table>
        <tr><th>취소 시점</th><th>예약금 환불</th></tr>
        <tr><td>이용일 7일 전까지</td><td><b style="color:var(--ok)">전액 환불</b></td></tr>
        <tr><td>이용일 6일 전 ~ 이용일</td><td><b style="color:var(--bad)">환불 불가</b></td></tr>
        <tr><td>이용 시작 이후</td><td><b style="color:var(--bad)">환불 불가</b></td></tr>
      </table>
      <p>· 취소는 마이페이지에서 직접 하실 수 있고, 취소 전에 환불 금액이 먼저 표시됩니다.</p>
      <p>· 환불은 취소 즉시 결제 취소로 진행되며, 카드사 사정에 따라 실제 입금까지 3~5영업일이 걸릴 수 있습니다.</p>
      <p>· 천재지변 등 부득이한 사정은 고객센터를 통해 별도로 처리됩니다.</p>
      <p style="margin-top:12px"><b style="color:var(--ink)">결제와 잔금</b></p>
      <p>· 홈페이지에서 결제하시는 금액은 예약금입니다. 남은 잔금은 이용 당일 현장에서 결제하십니다.</p>
      <p>· 현장에서 인원이 늘면 추가 인원 요금이 더해집니다. 최대 인원을 넘겨 입장하실 수 없습니다.</p>
      <p style="margin-top:12px"><b style="color:var(--ink)">이용 시 유의사항</b></p>
      <p>· 예약하신 타임의 시작 시각부터 종료 시각까지 이용하실 수 있습니다. 다음 이용자를 위한 정비 시간이 있어 종료 시각을 지켜주셔야 합니다.</p>
      <p>· 시설 파손이나 심한 오염이 확인되면 이용약관에 따라 복구 비용이 청구될 수 있습니다.</p>
      <p>· 예약자 본인이 아닌 분이 이용하실 경우 사전에 알려주셔야 합니다.</p>
      <p style="margin-top:10px;color:var(--muted)">— 규정 확인이 끝났습니다 —</p>
    </div>

    <div style="margin-top:16px">
      <label class="check"><input type="checkbox" id="a1" disabled />
        <span id="a1l" style="color:var(--muted)">[필수] 취소·환불 규정을 확인했고 이에 동의합니다</span></label>
      <label class="check"><input type="checkbox" id="a2" />
        <span>[필수] 이용약관과 개인정보 수집·이용에 동의합니다</span></label>
    </div>
    <div class="err-msg" id="e3" hidden></div>
    <div class="nav-btns">
      <button class="btn btn-line" data-prev>이전</button>
      <button class="btn btn-clay" data-next>다음</button>
    </div>`;
}

function step4() {
  const methods = [['CARD', '신용·체크카드'], ['KAKAOPAY', '카카오페이'],
                   ['NAVERPAY', '네이버페이'], ['TRANSFER', '계좌이체']];
  return `
    <h2 class="sec">예약금 결제</h2>
    ${summaryBox()}
    <h2 class="sec">결제 수단</h2>
    <div class="pay-methods">
      ${methods.map(([v, l]) =>
        `<button type="button" class="pm${ctx.method === v ? ' sel' : ''}" data-pm="${v}">${l}</button>`).join('')}
    </div>
    <div class="note" style="margin-top:18px">
      카드 정보는 쏘플 서버에 저장되지 않습니다. 결제사 화면에서 처리됩니다.
    </div>
    <div class="nav-btns">
      <button class="btn btn-line" data-prev>이전</button>
      <button class="btn btn-clay" id="payBtn">예약금 ${won(ctx.hold.deposit)} 결제하기</button>
    </div>`;
}

function bind() {
  const st = document.getElementById('stage');
  st.querySelector('[data-prev]')?.addEventListener('click', () => { ctx.step--; render(); });
  st.querySelector('[data-next]')?.addEventListener('click', onNext);

  if (ctx.step === 3) {
    const box = document.getElementById('pbox');
    const a1 = document.getElementById('a1');
    const check = () => {
      if (box.scrollTop + box.clientHeight >= box.scrollHeight - 12) {
        a1.disabled = false;
        document.getElementById('a1l').style.color = '';
        ctx.policyRead = true;
      }
    };
    box.addEventListener('scroll', check);
    check();
    if (ctx.policyRead) a1.checked = true;
  }

  if (ctx.step === 4) {
    st.querySelectorAll('[data-pm]').forEach((b) => b.addEventListener('click', () => {
      ctx.method = b.dataset.pm;
      st.querySelectorAll('[data-pm]').forEach((x) => x.classList.remove('sel'));
      b.classList.add('sel');
    }));
    document.getElementById('payBtn').addEventListener('click', pay);
  }
}

function onNext() {
  if (ctx.step === 2) {
    const gn = document.getElementById('gn').value.trim();
    const gp = document.getElementById('gp').value.replace(/[^0-9]/g, '');
    const e2 = document.getElementById('e2');
    if (!gn) return showErr(e2, '예약자 이름을 입력해 주세요.');
    if (gp.length < 10) return showErr(e2, '연락처를 확인해 주세요.');
    ctx.guestName = gn;
    ctx.guestPhone = gp;
    ctx.requestNote = document.getElementById('rq').value.trim();
  }
  if (ctx.step === 3) {
    if (!document.getElementById('a1').checked || !document.getElementById('a2').checked)
      return showErr(document.getElementById('e3'), '필수 항목에 모두 동의해 주세요.');
  }
  ctx.step++;
  render();
}

const showErr = (el, msg) => { el.textContent = msg; el.hidden = false; };

async function pay() {
  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>';
  try {
    const r = await API.post('/api/reservations', {
      holdId: ctx.hold.holdId,
      deposit: ctx.hold.deposit,
      people: ctx.people,
      guestName: ctx.guestName, guestPhone: ctx.guestPhone,
      requestNote: ctx.requestNote, agreeAll: true,
    }, { silent: true });

    clearInterval(timerId);

    if (r.payment.mode === 'test') {
      location.href = r.payment.approveUrl;   /* PG 계약 전 검수 흐름 */
      return;
    }

    if (!window.PortOne) {
      toast('결제 모듈을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.', 'bad');
      btn.disabled = false;
      btn.textContent = `예약금 ${won(ctx.hold.deposit)} 결제하기`;
      return;
    }
    const rs = await window.PortOne.requestPayment({
      storeId: r.payment.storeId, channelKey: r.payment.channelKey,
      paymentId: r.orderId, orderName: r.payment.orderName,
      totalAmount: r.deposit, currency: 'KRW',
      payMethod: ctx.method === 'CARD' ? 'CARD' : 'EASY_PAY',
      customer: r.payment.customer,
    });
    if (rs.code) {
      location.href = `/reservation-failed.html?branch=${ctx.branchId}&reason=${encodeURIComponent(rs.message || '결제가 취소되었습니다')}`;
      return;
    }
    await API.post('/api/payments/webhook', { orderId: r.orderId, paymentId: rs.paymentId }, { silent: true });
    location.href = `/reservation-complete.html?code=${r.code}`;
  } catch (e) {
    location.href = `/reservation-failed.html?branch=${ctx.branchId}&reason=${encodeURIComponent(e.message)}`;
  }
}

document.getElementById('quitBtn').addEventListener('click', async () => {
  if (ctx.hold) await API.del('/api/holds/' + ctx.hold.holdId, { silent: true }).catch(() => {});
  location.href = ctx.branchId ? `/room-detail.html?id=${ctx.branchId}` : '/rooms.html';
});
window.addEventListener('pagehide', () => {
  if (ctx.hold && ctx.step < 4) navigator.sendBeacon?.('/api/holds/' + ctx.hold.holdId);
});
</script>
<script src="https://cdn.portone.io/v2/browser-sdk.js" defer></script>
</body>
</html>
