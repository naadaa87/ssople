<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>예약이 확정되었습니다 — 쏘플파티룸</title><meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e8352e'/%3E%3Cpolygon points='16,5 18.7,12.8 27,12.8 20.3,17.8 22.9,26 16,20.9 9.1,26 11.7,17.8 5,12.8 13.3,12.8' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="/assets/app.css" />
<link rel="stylesheet" href="/assets/wire.css" />
<style>
  .wrap{max-width:600px;margin:0 auto;padding:60px 20px 80px;text-align:center}
  .mark{width:74px;height:74px;border-radius:50%;background:#e9f6ee;color:#1e7a46;
    display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 24px}
  h1{font-size:26px;font-weight:900;letter-spacing:-.03em;margin-bottom:10px}
  .lead{color:var(--muted);font-size:15px;margin-bottom:30px;line-height:1.7}
  .info{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);
    padding:22px;text-align:left;margin-bottom:20px}
  .info .r{display:flex;justify-content:space-between;gap:14px;padding:8px 0;font-size:14.5px}
  .info .k{color:var(--muted);font-weight:600;flex:none}
  .info .v{font-weight:700;text-align:right}
  .code{background:var(--ink);color:#fff;border-radius:12px;padding:16px;margin-bottom:18px}
  .code .l{font-size:12px;opacity:.65;font-weight:600}
  .code .n{font-size:22px;font-weight:900;letter-spacing:.06em}
  .acts{display:flex;gap:10px}
  .acts .btn{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">✓</div>
  <h1>예약이 확정되었습니다</h1>
  <p class="lead">예약 안내를 문자로 보내드렸습니다.<br>이용 하루 전에 방문 안내를 한 번 더 보내드립니다.</p>
  <div id="box">${''}</div>
</div>
<script src="/assets/app.js"></script>
<script>
const code = new URLSearchParams(location.search).get('code');
document.getElementById('box').innerHTML = loading();
render();
async function render(){
  const box = document.getElementById('box');
  if(!code){ box.innerHTML = emptyState('예약 정보를 찾을 수 없습니다',''); return; }
  const fallback = `<div class="code"><div class="l">예약번호</div><div class="n">${esc(code)}</div></div>
    <div class="acts"><a class="btn btn-line" href="/lookup.html?code=${esc(code)}">예약 조회</a>
    <a class="btn btn-clay" href="/mypage.html">예약 내역</a></div>`;
  try{
    const d = await API.get('/api/reservations/me', {silent:true});
    const r = [...d.upcoming, ...d.past].find(x => x.code === code);
    if(!r){ box.innerHTML = fallback; return; }
    box.innerHTML = `
      <div class="code"><div class="l">예약번호</div><div class="n">${esc(r.code)}</div></div>
      <div class="info">
        <div class="r"><span class="k">지점</span><span class="v">${esc(r.branchName)}</span></div>
        <div class="r"><span class="k">이용일</span><span class="v">${dateLabel(r.useDate)}</span></div>
        <div class="r"><span class="k">타임</span><span class="v">${esc(r.slotLabel)} ${esc(r.slotTime||'')}</span></div>
        <div class="r"><span class="k">인원</span><span class="v">${r.people}명</span></div>
        <div class="r"><span class="k">주소</span><span class="v">${esc(r.address||'')}</span></div>
        <div class="r"><span class="k">총 이용 금액</span><span class="v">${won(r.totalAmount)}</span></div>
        <div class="r"><span class="k">결제하신 예약금</span><span class="v">${won(r.deposit)}</span></div>
        <div class="r"><span class="k">현장 잔금</span><span class="v" style="color:var(--clay-deep)">${won(r.balance)}</span></div>
      </div>
      <div class="note" style="text-align:left;margin-bottom:20px">
        이용일 7일 전까지는 마이페이지에서 직접 취소하시면 예약금 전액을 돌려드립니다.
      </div>
      <div class="acts">
        <a class="btn btn-line" href="/rooms.html">다른 공간 보기</a>
        <a class="btn btn-clay" href="/mypage.html">예약 내역</a>
      </div>`;
  }catch(e){ box.innerHTML = fallback; }
}
</script>
<script src="/assets/chat.js"></script>
</body>
</html>
